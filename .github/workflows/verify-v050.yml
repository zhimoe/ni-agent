name: Stage verified Ni 0.5.0 release assets

on:
  push:
    branches: [ci/release-v0.5.0]

permissions:
  contents: write
  actions: read

jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Confirm the successful verification and draft
        run: |
          test "$(gh run view 46002002144 --json conclusion --jq .conclusion)" = success
          test "$(gh release view v0.5.0 --json isDraft --jq .isDraft)" = true
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: ni-v050-verified-packages
          path: audit-bin
          github-token: ${{ github.token }}
          run-id: 46002002144
      - name: Verify the packages and stage them on GitHub Releases
        shell: bash
        run: |
          python3 .github/release/verify-assets.py audit-bin release-assets
          (cd release-assets && sha256sum -c SHA256SUMS)
          cat release-assets/SHA256SUMS
          gh release upload v0.5.0 release-assets/*
          gh release view v0.5.0 --json assets --jq '.assets[] | {name,size,digest}'
