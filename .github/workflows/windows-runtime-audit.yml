name: Windows runtime audit

on:
  push:
    branches: [ci/windows-runtime-audit]

permissions:
  contents: read
  actions: read

jobs:
  windows:
    name: Windows ${{ matrix.arch }} ${{ matrix.test }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 7
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
        test: [console, integration]
        include:
          - arch: x64
            runner: windows-2025
          - arch: arm64
            runner: windows-11-arm
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
          architecture: ${{ matrix.arch }}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: windows-audit-binaries
          path: audit-bin
          # This last rerun changes only the console assertion.
          github-token: ${{ github.token }}
          run-id: 45981786565
      - name: Prepare and identify the packaged binaries
        id: prepare
        shell: pwsh
        run: |
          Copy-Item "audit-bin/${{ matrix.arch }}/*" .
          $pythonPath = (Get-Command python.exe).Source
          $pythonDirectory = Split-Path $pythonPath
          if (-not (Test-Path "$pythonDirectory/python3.exe")) {
            Copy-Item $pythonPath "$pythonDirectory/python3.exe"
          }
          python3 --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Output "Windows architecture $env:PROCESSOR_ARCHITECTURE"
          .\ni.exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native console, Unicode and redirection
        if: matrix.test == 'console'
        timeout-minutes: 2
        shell: pwsh
        run: |
          python tests/check_windows_console.py .\ni.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Session, Shell, RPC and MCP regression suite
        if: matrix.test == 'integration'
        timeout-minutes: 4
        shell: pwsh
        run: |
          .\test-all.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
